name: Build, Test and Analyze
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    # Diagnostic branch only: leave time to analyze and upload after stopping tests.
    timeout-minutes: 75
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.320'

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install gitversion
        run: dotnet tool install --global GitVersion.Tool --version 5.12.0

      - name: Prepare integration diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m1-diagnostics/public"
          for tool in dotnet-stack dotnet-dump dotnet-counters; do
            dotnet tool install "$tool" --version 9.0.661903 --allow-roll-forward --tool-path "$RUNNER_TEMP/m1-tools"
          done
          echo "$RUNNER_TEMP/m1-tools" >> "$GITHUB_PATH"
          {
            printf 'SHA=%s\nRun=%s\nAttempt=%s\nImage=%s\nImageVersion=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            dotnet --info
            dotnet --list-runtimes
            uname -a
            free -m
          } > "$RUNNER_TEMP/m1-diagnostics/public/environment.txt"

      - name: Restore NuGet packages
        shell: bash
        run: |
          for project in VictoryCenter/*/*.csproj; do
            lock_file="$(dirname "$project")/packages.lock.json"
            if [[ ! -f "$lock_file" ]]; then
              echo "Missing committed NuGet lock file: $lock_file" >&2
              exit 1
            fi
          done
          dotnet restore VictoryCenter/VictoryCenter.sln --locked-mode

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          dotnet sonarscanner begin \
            /k:"ita-social-projects_VictoryCenter-Back" \
            /o:"ita-social-projects" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/VictoryCenter.DbUpdate/Program.cs"

      - name: Build the solution
        run: dotnet build VictoryCenter/VictoryCenter.sln --no-incremental --no-restore

      - name: Run unit tests and generate coverage
        run:  dotnet-coverage collect "dotnet test VictoryCenter/VictoryCenter.UnitTests/VictoryCenter.UnitTests.csproj --configuration Release --no-restore" -f xml -o "coverage1.xml"

      - name: Run integration tests and generate coverage
        timeout-minutes: 55
        env:
          INTEGRATION_TESTS_DB_CONNECTION_STRING: ${{ vars.INTEGRATION_TESTS_DB_CONNECTION_STRING }}
          M1_DIAGNOSTICS_DIR: ${{ runner.temp }}/m1-diagnostics
        shell: bash
        run: bash scripts/ci/diagnose-integration-tests.sh

      - name: Upload integration diagnostics (no raw dumps)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m1-diagnostics/public/
            ${{ runner.temp }}/m1-diagnostics/results/
            !${{ runner.temp }}/m1-diagnostics/results/**/*.dmp
          if-no-files-found: warn
          retention-days: 3

      - name: Merge coverage reports
        run:  dotnet-coverage merge coverage1.xml coverage2.xml -f xml -o coverage.xml

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end
